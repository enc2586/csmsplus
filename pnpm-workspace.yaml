catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
# jsPDF's HTML rendering (html2canvas, canvg, dompurify, core-js) is unused here, and
# core-js runs an install script.
ignoredOptionalDependencies:
  - canvg
  - core-js
  - dompurify
  - html2canvas
